<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Contraseñas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; width: 100%; max-width: 480px; }
        h1 { font-size: 1.5rem; margin-bottom: 8px; color: #58a6ff; }
        p.subtitulo { font-size: 0.9rem; color: #8b949e; margin-bottom: 28px; }
        label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 8px; }
        .input-wrapper { position: relative; margin-bottom: 16px; }
        input { width: 100%; padding: 12px 44px 12px 16px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #58a6ff; }
        .toggle-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #8b949e; cursor: pointer; font-size: 1rem; }
        button.validar { width: 100%; padding: 12px; background: #238636; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-bottom: 24px; }
        button.validar:hover { background: #2ea043; }
        .resultado { display: none; border-radius: 8px; padding: 16px; }
        .resultado.valida { background: #0f2b1a; border: 1px solid #238636; }
        .resultado.invalida { background: #2d1217; border: 1px solid #f85149; }
        .resultado h3 { margin-bottom: 12px; font-size: 1rem; }
        .resultado.valida h3 { color: #3fb950; }
        .resultado.invalida h3 { color: #f85149; }
        .reglas { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .regla { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
        .regla.ok { color: #3fb950; }
        .regla.error { color: #f85149; }
        .badge { display: inline-block; margin-bottom: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 4px 12px; font-size: 0.75rem; color: #8b949e; }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">🔒 CI/CD con GitHub Actions</span>
        <h1>Validador de Contraseñas</h1>
        <p class="subtitulo">Verificá si tu contraseña cumple los requisitos de seguridad</p>
        <label for="password">Ingresá tu contraseña</label>
        <div class="input-wrapper">
            <input type="password" id="password" placeholder="Escribí tu contraseña acá..." />
            <button class="toggle-btn" onclick="toggleVisibilidad()">👁</button>
        </div>
        <button class="validar" onclick="validar()">Validar contraseña</button>
        <div class="resultado" id="resultado">
            <h3 id="titulo-resultado"></h3>
            <ul class="reglas" id="lista-reglas"></ul>
        </div>
    </div>

    <script>
        function toggleVisibilidad() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        async function validar() {
            const contrasena = document.getElementById('password').value;
            const resultado = document.getElementById('resultado');
            const titulo = document.getElementById('titulo-resultado');
            const lista = document.getElementById('lista-reglas');

            if (!contrasena) return;

            titulo.textContent = 'Validando...';
            resultado.style.display = 'block';
            resultado.className = 'resultado';

            try {
                const response = await fetch('https://twodainstanciaevaluativa.onrender.com/validar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contrasena: contrasena })
                });

                const data = await response.json();

                resultado.className = 'resultado ' + (data.valida ? 'valida' : 'invalida');
                titulo.textContent = data.valida ? '✅ Contraseña segura' : '❌ Contraseña insegura';

                const reglaTextos = {
                    'Debe tener al menos 8 caracteres': 'Al menos 8 caracteres',
                    'Debe tener al menos una mayuscula': 'Al menos una letra mayúscula',
                    'Debe tener al menos un numero': 'Al menos un número',
                    'Debe tener al menos un simbolo especial': 'Al menos un símbolo especial (!@#$%...)'
                };

                const todasLasReglas = Object.values(reglaTextos);

                lista.innerHTML = todasLasReglas.map(regla => {
                    const estaEnErrores = data.errores.some(e => reglaTextos[e] === regla);
                    return `<li class="regla ${estaEnErrores ? 'error' : 'ok'}">
                        ${estaEnErrores ? '✖' : '✔'} ${regla}
                    </li>`;
                }).join('');

            } catch (error) {
                titulo.textContent = '⚠️ Error conectando con el servidor';
                resultado.className = 'resultado invalida';
            }
        }

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') validar();
        });
    </script>
</body>
</html>
